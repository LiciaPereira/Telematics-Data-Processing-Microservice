services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    hostname: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  broker: #kafka server
    image: confluentinc/cp-kafka:7.6.0
    container_name: broker
    hostname: broker
    ports:
      - "9092:9092"
      - "9093:9093" #for internal communication
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    depends_on:
      - zookeeper

  telematics-db:
    image: postgres:latest
    container_name: telematics-db
    hostname: telematics-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}

  telemetry-api:
    build:
      context: . 
      dockerfile: TelemetryData.Api/Dockerfile 
    container_name: telemetry-api
    ports:
      - "5046:80"
    depends_on:
      - telematics-db
      - broker
    environment:
      ConnectionStrings__DefaultConnection: "Host=telematics-db;Port=5432;Database=${POSTGRES_DB_NAME};Username=postgres;Password=${POSTGRES_ROOT_PASSWORD}"
      GrpcServiceUrl: "http://telemetry-grpcservice:80"

  telemetry-grpcservice:
    build:
      context: . 
      dockerfile: TelemetryData.GrpcService/Dockerfile
    container_name: telemetry-grpcservice
    ports:
      - "5000:80"

  telemetry-consumerservice:
    build:
      context: . 
      dockerfile: TelemetryData.ConsumerService/Dockerfile
    container_name: telemetry-consumerservice
    environment:
      Kafka__BootstrapServers: ${KAFKA_BOOTSTRAP_SERVERS}
      Kafka__GroupId: ${KAFKA_GROUPID}
    depends_on:
      - broker